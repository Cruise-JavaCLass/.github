name: ✨ Feature Request
description: Suggest an idea or enhancement for the Cruise Management System
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: subsystem
    attributes:
      label: Target Subsystem
      options:
        - "Cruise-api"
        - "Cruise-web"
        - "Cruise-pos"
        - "Maritime Ops & AI Agents"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
